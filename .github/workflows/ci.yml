name: Go and container checks
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - name: Verify native CLI and package
        run: bash scripts/ci.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Verify browser behavior
        run: make dashboard-smoke
      - name: Build and smoke-test container
        run: make docker-smoke
      - name: Verify container browser behavior
        run: make docker-dashboard-smoke
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: stock-watcher-linux-amd64-${{ github.sha }}
          path: .builds/stock-watcher/linux/amd64/
          include-hidden-files: true
          retention-days: 7
